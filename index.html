<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5c4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KEUANGANKU">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>KEUANGANKU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: buku kas — kepala lengket dengan tab, isi per tab dalam kartu; satu kolom di ponsel */
:root{
  --bg:#f3f5f2; --paper:#ffffff; --ink:#18231f; --muted:#5d6b65; --line:#dde3df;
  --accent:#1d5c4b; --accent-soft:#e2eee9; --on-accent:#f3f5f2;
  --in:#1f7a46; --in-soft:#e1f2e7; --out:#b23a2e; --out-soft:#f8e4e1;
  --warn:#a86a00; --warn-soft:#fbefd6; --tf:#3b5d9c; --tf-soft:#e3eaf7;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --paper:#18211e; --ink:#e6ece9; --muted:#97a6a0; --line:#2a3632;
  --accent:#6fc2a6; --accent-soft:#1d2f29; --on-accent:#0f1715;
  --in:#5fca8b; --in-soft:#173123; --out:#f08a7e; --out-soft:#3a1f1c;
  --warn:#f0b54d; --warn-soft:#3a2d12; --tf:#8fb0ec; --tf-soft:#1c2740; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --paper:#18211e; --ink:#e6ece9; --muted:#97a6a0; --line:#2a3632;
  --accent:#6fc2a6; --accent-soft:#1d2f29; --on-accent:#0f1715;
  --in:#5fca8b; --in-soft:#173123; --out:#f08a7e; --out-soft:#3a1f1c;
  --warn:#f0b54d; --warn-soft:#3a2d12; --tf:#8fb0ec; --tf-soft:#1c2740; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .inner{display:grid;gap:8px;padding-block:12px 0}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin:0;line-height:1.1}
.monthnav{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;padding:3px}
.monthnav button{border:0;background:transparent;width:32px;height:32px;border-radius:7px;font-size:1.1rem}
.monthnav button:hover{background:var(--accent-soft)}
.monthnav span{min-width:120px;text-align:center;font-weight:600;font-size:.92rem}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;font-size:.92rem}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main .inner{padding-block:20px 110px;display:grid;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.grid3{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0}
h3{font-size:.95rem;margin:0;font-weight:600}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Hero */
.hero{background:var(--accent);color:var(--on-accent);border-radius:16px;padding:20px;display:grid;gap:14px}
.hero .lbl{color:inherit;opacity:.8}
.hero .big{font-family:var(--f-num);font-size:clamp(1.7rem,6vw,2.4rem);font-weight:500;line-height:1.1;overflow-wrap:anywhere}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid color-mix(in srgb,var(--on-accent) 30%,transparent);border-radius:999px;padding:4px 10px;font-size:.8rem;display:flex;gap:6px;background:transparent;color:inherit}
.chip .num{opacity:.9}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{padding:14px 16px;display:grid;gap:2px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(.82rem,3.4vw,1.12rem);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.in{color:var(--in)} .out{color:var(--out)} .warnc{color:var(--warn)}

/* Alerts */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:.88rem}
.alert b{font-weight:600}
.alert.bad{background:var(--out-soft)} .alert.warn{background:var(--warn-soft)} .alert.info{background:var(--accent-soft)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.alert.bad .dot{background:var(--out)} .alert.warn .dot{background:var(--warn)} .alert.info .dot{background:var(--accent)}

/* Buttons & forms */
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:600;background:var(--accent);color:var(--on-accent);font-size:.9rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:6px 10px;font-size:.8rem}
.btn.danger{background:var(--out);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:grid;gap:4px;font-size:.82rem;font-weight:500;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;font-size:.95rem;min-width:0}
input[type=checkbox]{width:auto}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink)}
.money{position:relative}
.money span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-num)}
.money input{padding-left:38px;font-family:var(--f-num);font-size:1.05rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:7px;padding:8px 6px;font-weight:600;color:var(--muted);font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.seg button[aria-pressed="true"][data-v="in"]{background:var(--in);color:var(--paper)}
.seg button[aria-pressed="true"][data-v="out"]{background:var(--out);color:var(--paper)}
.seg button[aria-pressed="true"][data-v="tf"]{background:var(--tf);color:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input{flex:1 1 180px}
.filters select{flex:1 1 130px;width:auto}

/* Lists */
.list{display:grid}
.day{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:12px 0 6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.tx:hover{background:color-mix(in srgb,var(--accent-soft) 50%,transparent)}
.ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-num);font-weight:500;flex:none}
.ic.in{background:var(--in-soft);color:var(--in)} .ic.out{background:var(--out-soft);color:var(--out)} .ic.tf{background:var(--tf-soft);color:var(--tf)}
.tx .t{min-width:0}
.tx .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t small{color:var(--muted);font-size:.8rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;text-align:right;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--out)} .amt.tf{color:var(--tf)}
.tag{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--muted);margin-left:6px;vertical-align:1px;font-weight:500}
.empty{padding:24px 8px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty p{margin:0;max-width:44ch}

/* Cards (wallets, goals, debts) */
.card{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--paper);min-width:0}
.card .top-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .name{font-weight:600;overflow-wrap:anywhere}
.card .kind{font-size:.75rem;color:var(--muted)}
.card .bal{font-family:var(--f-num);font-size:1.25rem;font-weight:500;overflow-wrap:anywhere}
.pill{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--in-soft);color:var(--in)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--out-soft);color:var(--out)} .pill.mute{background:var(--bg);color:var(--muted)}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar i.ok{background:var(--in)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--out)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}

.budget{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.budget:last-child{border-bottom:0}
.budget .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.budget .r1 span:first-child{font-weight:500}

/* Chart & table */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body)}
tfoot td{font-weight:600}

/* FAB */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:600;padding:14px 20px;box-shadow:0 6px 20px rgb(0 0 0/.22);display:flex;gap:8px;align-items:center;font-size:.95rem}
.fab b{font-size:1.3rem;line-height:1}

/* Dialog */
dialog{border:0;border-radius:16px;padding:0;background:var(--paper);color:var(--ink);width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgb(10 20 16/.5)}
dialog form{display:grid;gap:12px;padding:20px}
dialog .dh{display:flex;justify-content:space-between;align-items:center}
dialog .x{border:0;background:transparent;font-size:1.4rem;color:var(--muted);width:32px;height:32px;border-radius:8px}
.dfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:4px}
.dfoot .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--out);font-size:.84rem;min-height:1.1em;margin:0}

/* Akun & kunci */
.gated .top,.gated main,.gated .fab{display:none}
.gated::before{display:none}
.acct{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.95rem;flex:none}
#auth{min-height:100dvh;display:grid;place-items:center;padding-block:28px}
.authcard{width:min(400px,100%);display:grid;gap:18px}
.authbrand{display:grid;gap:6px;justify-items:center;text-align:center}
.authbrand img{width:64px;height:64px;border-radius:16px}
.authbrand h1{font-size:1.9rem}
.authbox{display:grid;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
.authbox .btn{padding:12px 14px;font-size:.95rem}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 2px;font-size:.88rem}
.authfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.okmsg{color:var(--in);font-size:.86rem;margin:0}
.pin{display:grid;gap:20px;justify-items:center;text-align:center}
.pin p{margin:0}
.dots{display:flex;gap:14px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keypad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-family:var(--f-num);font-size:1.5rem;color:var(--ink)}
.keypad button:active{background:var(--accent-soft)}
.keypad .k2{border:0;background:transparent;font-family:var(--f-body);font-size:.8rem;font-weight:600;color:var(--accent);line-height:1.2}
.keypad .k2:disabled{visibility:hidden}
.acctlist{display:grid;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:20;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="gated">

<header class="top gutter">
  <div class="inner">
    <div class="brand">
      <h1>KEUANGANKU</h1>
      <div class="row">
      <div class="monthnav" role="group" aria-label="Pilih bulan" id="monthnav">
        <button id="prevM" aria-label="Bulan sebelumnya">‹</button>
        <span id="monthLabel">—</span>
        <button id="nextM" aria-label="Bulan berikutnya">›</button>
      </div>
      <button class="acct" id="acctBtn" aria-label="Akun">?</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="beranda">Beranda</button>
      <button role="tab" data-tab="transaksi">Transaksi</button>
      <button role="tab" data-tab="dompet">Dompet</button>
      <button role="tab" data-tab="anggaran">Anggaran</button>
      <button role="tab" data-tab="target">Target</button>
      <button role="tab" data-tab="utang">Utang</button>
      <button role="tab" data-tab="laporan">Laporan</button>
    </nav>
  </div>
</header>

<div id="auth" class="gutter"><div class="authcard"><div class="authbrand"><img src="icon-192.png" alt=""><h1>KEUANGANKU</h1><p class="hint">Memuat…</p></div></div></div>
<main class="gutter"><div class="inner" id="view"></div></main>

<button class="fab" id="fab" aria-label="Catat transaksi"><b>+</b> Catat</button>
<dialog id="dlg"><form id="dlgForm" method="dialog" novalidate></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script id="core">
/* ===== Inti data & perhitungan (tanpa DOM) ===== */
const CATS={
  in:["Gaji","Usaha / Dagang","Bonus / THR","Hadiah","Investasi","Pinjaman / Piutang","Lainnya"],
  out:["Makan & Minum","Transportasi","Belanja Harian","Tagihan & Listrik","Sewa / Kos","Pulsa & Internet","Kesehatan","Pendidikan","Hiburan","Zakat & Donasi","Cicilan & Utang","Keluarga","Lainnya"]
};
const WALLET_KINDS=["Tunai","Bank","E-wallet","Tabungan","Lainnya"];
const BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const pad=n=>String(n).padStart(2,"0");
const todayStr=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ymOf=s=>String(s||"").slice(0,7);
function shiftMonth(m,d){let [y,mo]=m.split("-").map(Number);mo+=d;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+"-"+pad(mo)}
const daysIn=ym=>{const [y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()};
const uid=p=>(p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rp=n=>(n<0?"−":"")+"Rp"+Math.abs(Math.round(n||0)).toLocaleString("id-ID");
const rpShort=n=>{const a=Math.abs(n);if(a>=1e9)return (n/1e9).toLocaleString("id-ID",{maximumFractionDigits:1})+" M";if(a>=1e6)return (n/1e6).toLocaleString("id-ID",{maximumFractionDigits:1})+" jt";if(a>=1e3)return Math.round(n/1e3)+" rb";return String(Math.round(n))};
const monthName=ym=>{const [y,m]=ym.split("-").map(Number);return BULAN[m-1]+" "+y};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);

function emptyState(){return {v:2,wallets:[{id:"w-tunai",name:"Tunai",kind:"Tunai",initial:0}],tx:[],budgets:{},goals:[],debts:[],recurring:[]}}

/* Terima data v2, data v1 (array transaksi), atau file cadangan v1 {tx:[...]} */
function normalize(raw){
  let s;
  if(Array.isArray(raw)) raw={tx:raw};
  if(!raw||typeof raw!=="object") return emptyState();
  if(raw.v===2){s=Object.assign(emptyState(),raw)}
  else{s=emptyState();s.tx=(raw.tx||[]).map(t=>Object.assign({},t,{wallet:"w-tunai"}))}
  s.v=2;
  for(const k of ["wallets","tx","goals","debts","recurring"]) if(!Array.isArray(s[k])) s[k]=[];
  if(!s.budgets||typeof s.budgets!=="object"||Array.isArray(s.budgets)) s.budgets={};
  if(!s.wallets.length) s.wallets=emptyState().wallets;
  const wids=new Set(s.wallets.map(w=>w.id));
  s.tx=s.tx.filter(t=>t&&t.id&&["in","out","tf"].includes(t.type)&&typeof t.amount==="number"&&t.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.date));
  {const seen=new Set();s.tx=s.tx.filter(t=>seen.has(t.id)?false:(seen.add(t.id),true))}
  s.tx.forEach(t=>{if(!wids.has(t.wallet))t.wallet=s.wallets[0].id;if(t.type==="tf"&&!wids.has(t.to))t.to=s.wallets[0].id});
  s.debts.forEach(d=>{if(!Array.isArray(d.payments))d.payments=[]});
  s.goals.forEach(g=>{if(!Array.isArray(g.history))g.history=[]});
  s.recurring.forEach(r=>{if(!Array.isArray(r.posted))r.posted=[]});
  return s;
}

function walletBalance(s,wid,upto){
  const w=s.wallets.find(x=>x.id===wid);let b=w?(w.initial||0):0;
  for(const t of s.tx){
    if(upto&&t.date>upto)continue;
    if(t.type==="in"&&t.wallet===wid)b+=t.amount;
    else if(t.type==="out"&&t.wallet===wid)b-=t.amount;
    else if(t.type==="tf"){if(t.wallet===wid)b-=t.amount;if(t.to===wid)b+=t.amount}
  }
  return b;
}
const totalBalance=s=>s.wallets.reduce((a,w)=>a+walletBalance(s,w.id),0);
function monthTotals(s,ym,walletId){
  let inn=0,out=0;
  for(const t of s.tx){if(ymOf(t.date)!==ym)continue;if(walletId&&t.wallet!==walletId)continue;if(t.type==="in")inn+=t.amount;else if(t.type==="out")out+=t.amount}
  return {in:inn,out,net:inn-out};
}
function spendByCat(s,pred){const m={};for(const t of s.tx)if(t.type==="out"&&pred(t))m[t.cat]=(m[t.cat]||0)+t.amount;return m}
function budgetStatus(spent,limit){if(!limit)return "mute";const r=spent/limit;return r>=1?"bad":r>=.8?"warn":"ok"}
function goalSaved(s,g){return g.wallet?Math.max(0,walletBalance(s,g.wallet)):(g.saved||0)}
function debtLeft(d){return Math.max(0,d.amount-d.payments.reduce((a,p)=>a+p.amount,0))}

/* Transaksi rutin: buat transaksi untuk setiap bulan yang sudah jatuh tempo dan belum pernah dibuat */
function postRecurring(s,today){
  today=today||todayStr();const cur=ymOf(today);const day=Number(today.slice(8,10));let n=0;
  for(const r of s.recurring){
    if(!r.active||!r.start)continue;
    let m=r.start,guard=0;
    while(m<=cur&&guard++<240){
      const due=Math.min(r.day||1,daysIn(m));
      if(!r.posted.includes(m)&&(m<cur||day>=due)){
        s.tx.push({id:"rec-"+r.id+"-"+m,type:r.type,amount:r.amount,date:m+"-"+pad(due),cat:r.cat,note:r.name,wallet:r.wallet,createdAt:Date.now(),rec:r.id,sample:r.sample||undefined});
        r.posted.push(m);n++;
      }
      m=shiftMonth(m,1);
    }
  }
  return n;
}
function nextRecurringDate(r,today){
  today=today||todayStr();let m=ymOf(today);
  if(r.start>m)m=r.start;
  for(let i=0;i<24;i++){const d=m+"-"+pad(Math.min(r.day||1,daysIn(m)));if(!r.posted.includes(m)&&d>=today)return d;m=shiftMonth(m,1)}
  return null;
}
/* Data akun disimpan sebagai 1 dokumen "meta" + 1 dokumen transaksi per tahun */
function stable(v){if(Array.isArray(v))return "["+v.map(stable).join(",")+"]";if(v&&typeof v==="object")return "{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}";return JSON.stringify(v===undefined?null:v)}
function splitState(s){const years={};for(const t of s.tx){const y=t.date.slice(0,4);(years[y]||(years[y]=[])).push(t)}const meta=Object.assign({},s);delete meta.tx;return {meta:JSON.parse(JSON.stringify(meta)),years:JSON.parse(JSON.stringify(years))}}
function joinState(meta,years){return normalize(Object.assign({},meta||{},{v:2,tx:[].concat(...Object.values(years||{}))}))}
if(typeof module!=="undefined")module.exports={stable,splitState,joinState,normalize,walletBalance,totalBalance,monthTotals,postRecurring,nextRecurringDate,emptyState,shiftMonth,daysIn,goalSaved,debtLeft,budgetStatus};

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LEGACY=["keuanganku.v2","bukukas.tx.v1"];

/* ---------- Penyimpanan ke akun ---------- */
let S=emptyState();
let cloud=null,user=null,unsub=null,gate="loading",firstServer=false,lastMeta="",lastYears={};
function save(){
  if(!cloud||!user)return;
  const p=splitState(S),ch={years:{},deleteYears:[]};let any=false;
  const mj=stable(p.meta);if(mj!==lastMeta){ch.meta=p.meta;lastMeta=mj;any=true}
  for(const [y,tx] of Object.entries(p.years)){const j=stable(tx);if(j!==lastYears[y]){ch.years[y]=tx;lastYears[y]=j;any=true;if(j.length>900000)toast("Catatan tahun "+y+" hampir mencapai batas penyimpanan.")}}
  for(const y of Object.keys(lastYears))if(!p.years[y]){ch.deleteYears.push(y);delete lastYears[y];any=true}
  if(any)cloud.write(user.uid,ch).catch(e=>toast("Gagal menyimpan ke akun: "+(e&&e.message||"periksa koneksi")+". Coba lagi."));
}
function commit(msg){save();render();if(msg)toast(msg)}
function onCloud(d){
  const S2=joinState(d.meta,d.years),p=splitState(S2),cur=splitState(S);
  lastMeta=stable(p.meta);lastYears={};for(const [y,t] of Object.entries(p.years))lastYears[y]=stable(t);
  if(stable(p)!==stable(cur)){S=S2;if(gate==="open")render()}
  if(d.fromServer&&!firstServer){firstServer=true;afterFirstSync(d)}
}
function afterFirstSync(d){
  const empty=!Object.keys(d.meta||{}).length&&!Object.keys(d.years||{}).length;
  let msg="";
  if(empty){
    for(const k of LEGACY){let raw=null;try{raw=localStorage.getItem(k)}catch(e){}
      if(raw){try{const old=normalize(JSON.parse(raw));if(old.tx.length||old.wallets.length>1){S=old;msg="Catatan lama di perangkat ini dipindahkan ke akun Anda."}}catch(e){}
        try{localStorage.setItem(k+".dipindahkan",raw);localStorage.removeItem(k)}catch(e){}break}}
  }
  const n=postRecurring(S);
  save();
  if(n)msg=(msg?msg+" ":"")+n+" transaksi rutin dicatat otomatis.";
  if(msg)setTimeout(()=>toast(msg),300);
  if(gate==="open")render();
}

/* ---------- Form dialog generik ---------- */
/* fields: {id,label,type:'text'|'money'|'date'|'select'|'number'|'check'|'seg'|'textarea',options:[[v,l]]|fn(vals),show:fn(vals),required,hint} */
function openForm(cfg){
  const dlg=$("dlg"),form=$("dlgForm");

  function draw(){
    let h=`<div class="dh"><h2>${esc(cfg.title)}</h2><button type="button" class="x" data-close aria-label="Tutup">×</button></div>`;
    for(const f of cfg.fields){
      if(f.show&&!f.show(vals))continue;
      const v=vals[f.id]==null?"":vals[f.id];
      if(f.type==="seg"){
        h+=`<div class="seg" role="group" aria-label="${esc(f.label)}">${opts(f).map(([o,l])=>`<button type="button" data-seg="${f.id}" data-v="${esc(o)}" aria-pressed="${String(v)===String(o)}">${esc(l)}</button>`).join("")}</div>`;continue}
      if(f.type==="check"){h+=`<label class="check"><input type="checkbox" id="fld-${f.id}" data-f="${f.id}" ${v?"checked":""}> ${esc(f.label)}</label>`;continue}
      h+=`<label class="f">${esc(f.label)}`;
      if(f.type==="money")h+=`<div class="money"><span>Rp</span><input id="fld-${f.id}" data-f="${f.id}" data-money inputmode="numeric" placeholder="0" value="${esc(fmtMoneyInput(v))}"></div>`;
      else if(f.type==="select")h+=`<select id="fld-${f.id}" data-f="${f.id}">${opts(f).map(([o,l])=>`<option value="${esc(o)}" ${String(v)===String(o)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
      else if(f.type==="textarea")h+=`<textarea id="fld-${f.id}" data-f="${f.id}" rows="2" maxlength="200">${esc(v)}</textarea>`;
      else h+=`<input id="fld-${f.id}" data-f="${f.id}" type="${f.type==="number"?"number":f.type==="date"?"date":f.type==="month"?"month":"text"}" ${f.type==="number"?`inputmode="numeric" min="${f.min||1}" max="${f.max||31}"`:""} maxlength="80" value="${esc(v)}" ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:""}>`;
      if(f.hint)h+=`<span class="hint">${esc(typeof f.hint==="function"?f.hint(vals):f.hint)}</span>`;
      h+=`</label>`;
    }
    h+=`<p class="err" id="dlgErr" role="alert"></p><div class="dfoot">`;
    if(cfg.onDelete)h+=askDel?`<span class="row"><button type="button" class="btn danger small" data-del="yes">Ya, hapus</button><button type="button" class="btn ghost small" data-del="no">Batal</button></span>`:`<button type="button" class="btn ghost small" data-del="ask">Hapus</button>`;
    h+=`<span class="right"><button type="button" class="btn ghost" data-close>Batal</button><button type="submit" class="btn">${esc(cfg.submit||"Simpan")}</button></span></div>`;
    form.innerHTML=h;
  }
  function read(){
    form.querySelectorAll("[data-f]").forEach(el=>{const k=el.dataset.f;vals[k]=el.type==="checkbox"?el.checked:el.hasAttribute("data-money")?parseMoney(el.value):el.value});
  }
  form.oninput=e=>{
    const el=e.target;
    if(el.hasAttribute("data-money")){const d=el.value.replace(/\D/g,"").replace(/^0+/,"");el.value=d?Number(d).toLocaleString("id-ID"):""}
  };
  form.onchange=e=>{if(e.target.dataset.f&&cfg.fields.some(f=>f.redraw&&f.id===e.target.dataset.f)){read();if(cfg.onChange)cfg.onChange(vals,e.target.dataset.f);draw()}};
  form.onclick=e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-close")){dlg.close();return}
    if(b.dataset.seg){read();vals[b.dataset.seg]=b.dataset.v;if(cfg.onChange)cfg.onChange(vals,b.dataset.seg);draw();return}
    if(b.dataset.del==="ask"){askDel=true;read();draw();return}
    if(b.dataset.del==="no"){askDel=false;read();draw();return}
    if(b.dataset.del==="yes"){cfg.onDelete();dlg.close();return}
  };
  form.onsubmit=e=>{
    e.preventDefault();read();
    const err=cfg.validate?cfg.validate(vals):null;
    if(err){$("dlgErr").textContent=err;return}
    cfg.onSave(vals);dlg.close();
  };
  draw();
  if(!dlg.open)dlg.showModal();
  const first=form.querySelector("[data-money],input:not([type=checkbox]),select");if(first)setTimeout(()=>first.focus(),30);
}

/* ---------- Grafik ---------- */
function barChart(months,opts){
  opts=opts||{};
  const data=months.map(mo=>Object.assign({mo},monthTotals(S,mo)));
  const max=Math.max(1,...data.map(d=>Math.max(d.in,d.out)));
  const step=niceStep(max/3),top=Math.ceil(max/step)*step;
  const narrow=window.innerWidth<640,W=narrow?360:600,H=narrow?190:210,L=narrow?44:54,R=4,T=10,B=26,n=months.length,cw=(W-L-R)/n,bw=Math.min(18,cw/3.4);
  const yy=v=>T+(H-T-B)*(1-v/top);
  let g="";
  for(let v=0;v<=top+1e-6;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)"/><text x="${L-6}" y="${yy(v)+4}" text-anchor="end" font-size="${narrow?9:10}" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v?rpShort(v):"0"}</text>`;
  data.forEach((d,i)=>{
    const cx=L+cw*i+cw/2,cur=d.mo===opts.highlight,[yr,mo]=d.mo.split("-").map(Number);
    const op=opts.highlight?(cur?1:.5):1;
    g+=`<rect x="${cx-bw-1.5}" y="${yy(d.in)}" width="${bw}" height="${Math.max(0,yy(0)-yy(d.in))}" rx="2" fill="var(--in)" opacity="${op}"><title>${BULAN[mo-1]} — masuk ${rp(d.in)}</title></rect>`;
    g+=`<rect x="${cx+1.5}" y="${yy(d.out)}" width="${bw}" height="${Math.max(0,yy(0)-yy(d.out))}" rx="2" fill="var(--out)" opacity="${op}"><title>${BULAN[mo-1]} — keluar ${rp(d.out)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="${narrow?(n>6?9:10.5):11}" fill="${cur?"var(--ink)":"var(--muted)"}" font-weight="${cur?600:400}" font-family="IBM Plex Sans,sans-serif">${BULAN[mo-1].slice(0,3)}${!opts.noYear&&!narrow&&(mo===1||i===0)?" "+String(yr).slice(2):""}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik pemasukan dan pengeluaran">${g}</svg>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
const legend=`<div class="legend"><span><b style="background:var(--in)"></b>Masuk</span><span><b style="background:var(--out)"></b>Keluar</span></div>`;

/* ---------- Daftar transaksi ---------- */
function txRows(list,withDays){
  let h="",last="";
  for(const t of list){
    if(withDays&&t.date!==last){last=t.date;const d=new Date(t.date+"T00:00:00");const sum=list.filter(r=>r.date===t.date).reduce((a,r)=>a+(r.type==="in"?r.amount:r.type==="out"?-r.amount:0),0);
      h+=`<div class="day"><span>${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]}</span><span class="num">${sum>0?"+":""}${rp(sum)}</span></div>`}
    const sub=t.type==="tf"?`${esc(wName(t.wallet))} → ${esc(wName(t.to))}`:`${esc(t.cat)} · ${esc(wName(t.wallet))}`;
    h+=`<button class="tx" data-tx="${esc(t.id)}"><span class="ic ${t.type}" aria-hidden="true">${sign(t)}</span><span class="t"><b>${esc(t.note||(t.type==="tf"?"Transfer":t.cat))}${t.rec?'<span class="tag">rutin</span>':""}${t.sample?'<span class="tag">contoh</span>':""}</b><small>${withDays?"":fmtDate(t.date)+" · "}${sub}</small></span><span class="amt ${t.type}">${t.type==="in"?"+":t.type==="out"?"−":""}${rp(t.amount)}</span></button>`;
  }
  return h;
}
const sortTx=a=>a.sort((x,y)=>y.date.localeCompare(x.date)||(y.createdAt||0)-(x.createdAt||0));

/* ---------- Tampilan per tab ---------- */
function alerts(){
  const out=[];const today=todayStr();
  const sp=spendByCat(S,t=>ymOf(t.date)===month);
  for(const [c,lim] of Object.entries(S.budgets)){const s=sp[c]||0;const st=budgetStatus(s,lim);
    if(st==="bad")out.push(["bad",`Anggaran <b>${esc(c)}</b> terlampaui: ${rp(s)} dari ${rp(lim)}.`]);
    else if(st==="warn")out.push(["warn",`Anggaran <b>${esc(c)}</b> sudah terpakai ${Math.round(s/lim*100)}%. Sisa ${rp(lim-s)}.`])}
  for(const d of S.debts){const left=debtLeft(d);if(!left||!d.due)continue;const dd=daysBetween(today,d.due);
    const who=d.kind==="utang"?`Utang ke <b>${esc(d.person)}</b>`:`Piutang dari <b>${esc(d.person)}</b>`;
    if(dd<0)out.push(["bad",`${who} lewat jatuh tempo ${-dd} hari. Sisa ${rp(left)}.`]);
    else if(dd<=7)out.push(["warn",`${who} jatuh tempo ${dd===0?"hari ini":dd+" hari lagi"}. Sisa ${rp(left)}.`])}
  for(const r of S.recurring){if(!r.active)continue;const nd=nextRecurringDate(r,today);if(nd&&daysBetween(today,nd)<=5)out.push(["info",`<b>${esc(r.name)}</b> ${rp(r.amount)} akan dicatat ${daysBetween(today,nd)===0?"hari ini":"tanggal "+fmtDate(nd)}.`])}
  return out;
}

  }
  const L=getLock();if(!L){setGate("setpin");return}
  if(await hashPin(pin,L.salt)===L.hash){L.fails=0;setLock(L);pinBuf="";pinMsg="";setGate("open");return}
  L.fails=(L.fails||0)+1;setLock(L);pinBuf="";
  if(L.fails>=MAX_FAIL){await signOutAll("PIN salah "+MAX_FAIL+" kali. Masuk lagi dengan email dan kata sandi.");return}
  pinMsg="PIN salah. Sisa "+(MAX_FAIL-L.fails)+" percobaan.";redrawDots(true);
}
async function tryBio(){
  const L=getLock();if(!L||!L.cred)return;
  try{if(await bioGet(L.cred)&&gate==="locked"){L.fails=0;setLock(L);pinBuf="";pinMsg="";setGate("open")}}
  catch(e){if(e&&e.name!=="NotAllowedError"&&e.name!=="AbortError"){pinMsg=BIO+" tidak bisa dipakai. Gunakan PIN.";redrawDots()}}
}
async function signOutAll(msg){
  setLock(null);if(unsub){unsub();unsub=null}
  authMode="login";authMsg=msg||"";authOk="";pinBuf="";pinFirst=null;pinMsg="";
  try{await cloud.signOut()}catch(e){}
}
function pinKey(k){
  if(gate!=="setpin"&&gate!=="locked")return;
  if(k==="del"){pinBuf=pinBuf.slice(0,-1);redrawDots();return}
  if(k==="bio"){tryBio();return}
  if(/^\d$/.test(k)&&pinBuf.length<PIN_LEN){pinBuf+=k;if(pinMsg&&pinBuf.length===1){pinMsg=""}redrawDots();if(pinBuf.length===PIN_LEN)setTimeout(pinDone,120)}
}
$("auth").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.k)return pinKey(b.dataset.k);
  if(b.dataset.mode){const em=$("aEmail");if(em)$("auth").dataset.email=em.value;authMode=b.dataset.mode;authMsg="";authOk="";drawGate();return}
  const a=b.dataset.a;
  if(a==="forgot")await signOutAll("Masuk dengan email dan kata sandi, lalu buat PIN baru.");
  else if(a==="cancelpin"){pinBuf="";pinFirst=null;pinMsg="";setGate("open")}
  else if(a==="bioOn"){b.disabled=true;try{const L=getLock();L.cred=await bioCreate();setLock(L);toast(BIO+" aktif.");setGate("open")}catch(err){pinMsg=BIO+" tidak bisa diaktifkan"+(err&&err.name==="NotAllowedError"?" (dibatalkan)":"")+". Anda bisa mencobanya lagi dari menu Akun.";b.disabled=false;drawGate()}}
  else if(a==="bioSkip"){pinMsg="";toast("PIN dibuat.");setGate("open")}
});
$("auth").addEventListener("submit",e=>{e.preventDefault();if(!authBusy)submitAuth()});
document.addEventListener("keydown",e=>{if((gate==="setpin"||gate==="locked")&&!e.metaKey&&!e.ctrlKey){if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace")pinKey("del")}});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(gate==="open"&&getLock()&&hiddenAt&&Date.now()-hiddenAt>LOCK_AFTER_MS){bioTried=false;setGate("locked");autoBio()}
  else if(gate==="open"&&firstServer){const n=postRecurring(S);if(n)commit(n+" transaksi rutin dicatat otomatis.")}
});
function autoBio(){const L=getLock();if(gate==="locked"&&L&&L.cred&&bioOk&&!bioTried&&!document.hidden){bioTried=true;setTimeout(tryBio,250)}}

/* Menu akun */
$("acctBtn").onclick=()=>{
  const L=getLock()||{};const dlg=$("dlg"),form=$("dlgForm");
  form.innerHTML=`<div class="dh"><h2>Akun</h2><button type="button" class="x" data-c aria-label="Tutup">×</button></div>
    <div class="card"><span class="lbl">Masuk sebagai</span><span class="name">${esc(user.email)}</span><span class="kind">${user.verified?"Email terverifikasi":"Email belum diverifikasi"}</span></div>
    <div class="acctlist">
      <button type="button" class="btn ghost" data-u="lock">Kunci sekarang</button>
      <button type="button" class="btn ghost" data-u="pin">Ubah PIN</button>
      ${bioOk?`<button type="button" class="btn ghost" data-u="bio">${L.cred?"Matikan ":"Aktifkan "}${esc(BIO)}</button>`:""}
      ${user.verified?"":`<button type="button" class="btn ghost" data-u="verify">Kirim ulang email verifikasi</button>`}
      <button type="button" class="btn ghost" data-u="out">Keluar dari akun</button>
    </div>
    <p class="hint">Catatan tersimpan di akun ini dan sama di semua perangkat. Aplikasi terkunci otomatis jika ditinggalkan lebih dari 1 menit.</p>`;
  form.onsubmit=e=>e.preventDefault();form.oninput=null;form.onchange=null;
  form.onclick=async e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-c")){dlg.close();return}
    const u=b.dataset.u;if(!u)return;
    if(u==="lock"){dlg.close();bioTried=true;setGate("locked")}
    else if(u==="pin"){dlg.close();pinBuf="";pinFirst=null;pinMsg="";setGate("setpin")}
    else if(u==="bio"){const LL=getLock();if(LL.cred){LL.cred=null;setLock(LL);toast(BIO+" dimatikan.");dlg.close()}else{try{LL.cred=await bioCreate();setLock(LL);toast(BIO+" aktif.");dlg.close()}catch(err){toast(BIO+" tidak bisa diaktifkan.")}}}
    else if(u==="verify"){try{await cloud.verify();toast("Email verifikasi dikirim ke "+user.email+".")}catch(err){toast(authErr(err))}}
    else if(u==="out"){dlg.close();await signOutAll("Anda sudah keluar.")}
  };
  if(!dlg.open)dlg.showModal();
};

/* Mulai: dipanggil setelah server akun siap */
window.bootApp=async function(c,err){
  cloud=c;bioOk=await bioAvailable();
  if(!cloud){setGate("nocloud");drawGate(err);return}
  cloud.onAuth(u=>{
    if(unsub){unsub();unsub=null}
    clearTimeout(loadTimer);
    user=u;firstServer=false;S=emptyState();lastMeta="";lastYears={};pinBuf="";pinFirst=null;
    if(!u){setGate("auth");return}
    authMsg="";setGate("loading");
    loadTimer=setTimeout(()=>{if(gate==="loading"){authMsg="Menunggu koneksi internet… Masuk pertama kali di perangkat ini memerlukan internet.";drawGate()}},8000);
    unsub=cloud.subscribe(u.uid,d=>{
      onCloud(d);
      if(gate==="loading"&&(d.fromServer||Object.keys(d.meta||{}).length)){
        clearTimeout(loadTimer);authMsg="";
        if(getLock()){bioTried=false;setGate("locked");autoBio()}else{pinMsg="";setGate("setpin")}
      }
    },e=>{authMsg="Tidak bisa memuat data akun: "+(e&&e.message||e)+". Muat ulang halaman.";if(gate==="loading")drawGate();else toast(authMsg)});
  });
};
})();
</script>
<script src="firebase-config.js"></script>
<script type="module">
/* Penghubung ke Firebase (Authentication + Firestore) */
const cfg=window.FIREBASE_CONFIG;
if(window.__CLOUD_MOCK__){window.bootApp(window.__CLOUD_MOCK__)}
else if(!cfg||!cfg.apiKey||/^ISI/.test(cfg.apiKey)){window.bootApp(null)}
else{
  try{
    const V="10.12.2",base="https://www.gstatic.com/firebasejs/"+V+"/";
    const [{initializeApp},A,F]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
    const app=initializeApp(cfg);
    const auth=A.getAuth(app);
    let db;
    try{db=F.initializeFirestore(app,{ignoreUndefinedProperties:true,localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
    catch(e){db=F.getFirestore(app)}
    const toUser=u=>u?{uid:u.uid,email:u.email,verified:u.emailVerified}:null;
    window.bootApp({
      onAuth:cb=>A.onAuthStateChanged(auth,u=>cb(toUser(u))),
      signUp:async(e,p)=>{const c=await A.createUserWithEmailAndPassword(auth,e,p);try{await A.sendEmailVerification(c.user)}catch(_){}},
      signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
      signOut:()=>A.signOut(auth),
      reset:e=>A.sendPasswordResetEmail(auth,e),
      verify:()=>A.sendEmailVerification(auth.currentUser),
      subscribe(uid,onData,onErr){
        let m=null,y=null,ms=false,ys=false;
        const emit=()=>{if(m!==null&&y!==null)onData({meta:m,years:y,fromServer:ms&&ys})};
        const u1=F.onSnapshot(F.doc(db,"users",uid),{includeMetadataChanges:true},s=>{m=s.exists()?s.data():{};ms=ms||!s.metadata.fromCache;emit()},onErr);
        const u2=F.onSnapshot(F.collection(db,"users",uid,"tahun"),{includeMetadataChanges:true},s=>{const o={};s.forEach(d=>o[d.id]=d.data().tx||[]);y=o;ys=ys||!s.metadata.fromCache;emit()},onErr);
        return()=>{u1();u2()};
      },
      write(uid,ch){
        const b=F.writeBatch(db);
        if(ch.meta)b.set(F.doc(db,"users",uid),ch.meta);
        for(const [yr,tx] of Object.entries(ch.years||{}))b.set(F.doc(db,"users",uid,"tahun",yr),{tx});
        for(const yr of ch.deleteYears||[])b.delete(F.doc(db,"users",uid,"tahun",yr));
        return b.commit();
      }
    });
  }catch(e){window.bootApp(null,e)}
}
</script>
